<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F9F8F6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="東京行">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>東京行 2027</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 放在 HTML 裡，外部 JS 出錯也照常更新。新版接手後重載一次，首次安裝不重載。
        if ('serviceWorker' in navigator) {
            const hadController = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (hadController) location.reload();
            });
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</head>
<body>
    <div id="app">
        <header class="top">
            <div class="top-bar">
                <span class="top-title">東京行 2/7-2/13</span>
                <span id="trip-status" class="top-status"></span>
            </div>
            <nav id="days" class="days" aria-label="每日行程"></nav>
        </header>

        <main id="main"></main>

        <button id="fab" class="fab" aria-label="新增行程">+</button>

        <nav class="tabs" aria-label="主要頁面">
            <button class="tab" data-view="plan">行程</button>
            <button class="tab" data-view="prep">準備<span id="task-count" class="tab-badge" hidden></span></button>
            <button class="tab" data-view="info">資訊</button>
        </nav>
    </div>

    <dialog id="sheet" class="sheet"><div id="sheet-body"></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>

    <noscript>這個 App 需要開啟 JavaScript。</noscript>
    <script src="js/spots.js"></script>
    <script src="js/trip-data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
